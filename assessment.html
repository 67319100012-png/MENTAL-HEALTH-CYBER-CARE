<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมิน - โครงการ อสม. ฮีลใจ</title>
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
        }

        body {
            color: #333;
            line-height: 1.6;
            background-color: #f7faf5;
        }

        /* ---------------- Header / Navigation Bar ---------------- */
        header {
            background-color: #9cb380;
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        header .logo {
            font-size: 1.1rem;
            font-weight: 600;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        nav a:hover, nav a.active {
            opacity: 0.8;
            text-decoration: underline;
            font-weight: 600;
        }

        /* ---------------- Content Area ---------------- */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-title {
            text-align: center;
            color: #1e5631;
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Responsive สำหรับมือถือ */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 12px;
                padding: 15px 20px;
                text-align: center;
            }

            nav {
                justify-content: center;
                gap: 12px;
            }

            nav a {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation Bar (เหมือนหน้า Index) -->
    <header>
        <div class="logo">MENTAL HEALTH CYBER-CARE</div>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="assessment.html" class="active">แบบประเมิน</a>
            <a href="index.html#contact">ติดต่อหรือปรึกษา</a>
        </nav>
    </header>

    <!-- เนื้อหาหน้าแบบประเมิน -->
    <div class="container">
        <h1 class="page-title">ระบบคัดกรองและประเมินสุขภาพจิต</h1>
        
        <!-- ใส่โค้ดคำถามหรือแบบฟอร์มประเมินตรงส่วนนี้ -->

    </div>

</body>
</html>
